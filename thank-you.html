<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Thanks — we've got your message | Sigma Soft AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your message has been received by Sigma Soft AI. We'll get back to you shortly.">
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicon -->
    <link href="img/favicon64.png" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background:
                radial-gradient(ellipse 80% 60% at 50% 40%, rgba(58, 166, 164, 0.14) 0%, transparent 60%),
                radial-gradient(ellipse at center, #0b1730 0%, #071022 55%, #030711 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .thanks-card {
            max-width: 560px;
            text-align: center;
            color: #fff;
        }

        .thanks-card img {
            height: 34px;
            width: auto;
            margin-bottom: 40px;
        }

        .thanks-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 8px 30px rgba(58, 166, 164, 0.35);
        }

        .thanks-icon i {
            font-size: 30px;
            color: #fff;
        }

        .thanks-card h1 {
            font-family: 'MuseoModerno', cursive;
            font-size: clamp(1.9rem, 5vw, 2.6rem);
            margin-bottom: 16px;
        }

        .thanks-card p {
            color: rgba(255, 255, 255, 0.78);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .thanks-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
        }

        .thanks-primary,
        .thanks-secondary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .thanks-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(58, 166, 164, 0.3);
        }

        .thanks-primary:hover {
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(58, 166, 164, 0.4);
        }

        .thanks-secondary {
            border: 2px solid rgba(255, 255, 255, 0.85);
            color: #fff;
            font-weight: 600;
        }

        .thanks-secondary:hover {
            background: #fff;
            color: var(--dark);
        }
    </style>
</head>

<body>
    <div class="thanks-card">
        <img src="new_logos/straight_wordmark_cropped.png" alt="Sigma Soft AI">

        <div class="thanks-icon">
            <i class="fa fa-check"></i>
        </div>

        <h1>Thanks — we've got it</h1>
        <p>
            Your message is with us and a senior engineer will get back to you.
            If it's urgent, calling is the fastest way to reach a real person.
        </p>

        <div class="thanks-actions">
            <a href="tel:+92-326-1776046" class="thanks-primary" aria-label="Call Sigma Soft AI — +92 326 1776046">
                <i class="fa fa-phone"></i>
                Call — +92 326 1776046
            </a>
            <a href="index.html" class="thanks-secondary">
                <i class="fa fa-arrow-left"></i>
                Back to site
            </a>
        </div>
    </div>
</body>

</html>
