<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Hero Test — Particle Globe | Sigma Soft AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

    <!-- Site design system (brand vars, hero CTA look-alikes, title-font) -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

    <!-- Globe particles component (untouched, reused as-is) -->
    <link href="globe-particles/globe-particles.css" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            background: var(--dark);
        }

        .globe-hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            overflow: hidden;
            background:
                radial-gradient(ellipse 80% 60% at 78% 45%, rgba(58, 166, 164, 0.16) 0%, transparent 60%),
                radial-gradient(ellipse at center, #0b1730 0%, #071022 55%, #030711 100%);
        }

        .globe-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: radial-gradient(ellipse at 30% 50%, black 0%, transparent 70%);
            pointer-events: none;
        }

        .globe-hero .container-fluid {
            position: relative;
            z-index: 2;
            padding: 0 6vw;
        }

        .globe-hero-brand {
            position: absolute;
            top: 32px;
            left: 6vw;
            z-index: 3;
        }

        .globe-hero-brand img {
            height: 34px;
            width: auto;
            display: block;
        }

        @media (max-width: 991px) {
            .globe-hero-brand {
                position: static;
                display: flex;
                justify-content: center;
                padding-top: 28px;
            }
        }

        .globe-hero-row {
            display: flex;
            align-items: center;
            gap: 4vw;
            flex-wrap: wrap;
        }

        .globe-hero-copy {
            flex: 1 1 480px;
            max-width: 620px;
            padding: 60px 0;
        }

        .globe-hero-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .globe-hero-eyebrow::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 12px 2px rgba(58, 166, 164, 0.7);
        }

        .globe-hero-copy h1 {
            font-family: 'MuseoModerno', cursive;
            color: #fff;
            font-size: clamp(2.4rem, 4.2vw, 3.6rem);
            line-height: 1.12;
            margin-bottom: 20px;
        }

        .globe-hero-copy h1 .accent {
            color: var(--primary);
        }

        .globe-hero-copy p.lead-copy {
            font-family: 'Nunito', sans-serif;
            color: rgba(255, 255, 255, 0.78);
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 32px;
            max-width: 540px;
        }

        /* Hero CTA styles (matched to the live homepage's hero-cta-* look) */
        .hero-cta-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            color: white;
            font-weight: 700;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 18px;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(58, 166, 164, 0.3);
        }

        .hero-cta-primary:hover {
            background: var(--secondary);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(58, 166, 164, 0.4);
        }

        .hero-cta-secondary {
            background: transparent;
            border: 2px solid white;
            color: white;
            font-weight: 600;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .hero-cta-secondary:hover {
            background: white;
            color: var(--dark);
            transform: translateY(-2px);
        }

        .hero-cta-tertiary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-weight: 500;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .hero-cta-tertiary:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            transform: translateY(-1px);
        }

        .cta-microcopy {
            font-family: 'Nunito', sans-serif;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 16px;
            font-style: italic;
        }

        .globe-hero-ctas {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 8px;
        }

        .globe-hero-tertiary-row {
            margin-top: 14px;
        }

        /* Globe stage: the "zoomed in element" side of the hero */
        .globe-hero-stage {
            position: relative;
            flex: 1 1 380px;
            max-width: 620px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .globe-hero-stage .globe-particles-shell {
            width: min(100%, 620px);
            filter: drop-shadow(0 30px 60px rgba(0, 0, 0, 0.55));
        }

        .globe-hero-stage .globe-particles-canvas {
            pointer-events: none;
            z-index: 2;
        }

        /* Code-rain backdrop: stays exactly within the globe's own square
           shell (no expansion — zero risk of spilling into the copy column
           at any viewport width) and the mask hides the center where the
           sphere sits, so text only peeks through the square's corners,
           right at the globe's edge. Wrapped in a plain div because a bare
           <canvas> is a replaced element and won't stretch via inset +
           width:auto — it just falls back to its intrinsic 300x150 default. */
        .code-rain-wrap {
            position: absolute;
            inset: 0;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
            mask-image: radial-gradient(circle at center, transparent 0%, transparent 60%, black 74%, black 90%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle at center, transparent 0%, transparent 60%, black 74%, black 90%, transparent 100%);
        }

        .code-rain-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .globe-particles-shell.is-hovering .code-rain-wrap {
            opacity: 0.4;
        }

        .globe-hero-hint {
            position: absolute;
            bottom: 6%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.45);
            font-family: 'Nunito', sans-serif;
            font-size: 12.5px;
            letter-spacing: 0.03em;
            text-align: center;
            white-space: nowrap;
        }

        @media (max-width: 991px) {
            .globe-hero {
                flex-direction: column;
            }

            .globe-hero-row {
                flex-direction: column-reverse;
                text-align: center;
                padding-top: 20px;
            }

            .globe-hero-copy h1 {
                font-size: clamp(1.9rem, 8vw, 2.6rem);
            }

            .globe-hero-copy {
                padding: 20px 0 50px;
                max-width: 100%;
            }

            .globe-hero-copy p.lead-copy {
                margin-left: auto;
                margin-right: auto;
            }

            .globe-hero-ctas,
            .globe-hero-tertiary-row {
                justify-content: center;
            }

            .globe-hero-stage {
                width: 100%;
                max-width: 420px;
                margin: 0 auto;
            }

            .globe-hero-hint {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- ================= HERO CONCEPT: PARTICLE GLOBE ================= -->
    <section class="globe-hero">
        <div class="globe-hero-brand">
            <img src="new_logos/straight_wordmark_cropped.png" alt="Sigma Soft AI">
        </div>
        <div class="container-fluid">
            <div class="globe-hero-row">

                <!-- Copy -->
                <div class="globe-hero-copy">
                    <!-- <div class="globe-hero-eyebrow">AI · Software · Business Automation</div> -->
                    <h1>Softwares that change your <span class="accent">World</span></h1>
                    <p class="lead-copy">
                        AI systems, automation, and full-stack platforms — designed and shipped
                        by senior engineers to move your business forward.
                    </p>

                    <div class="globe-hero-ctas">
                        <a href="tel:+92-326-1776046" class="hero-cta-primary" aria-label="Call SigmasoftAI — Head Office (New York) +92 326 1776046">
                            <i class="fa fa-phone"></i>
                            Call Now — +92 326 1776046
                        </a>
                    </div>

                    <div class="cta-microcopy">
                        <p class="mb-1">No automated menu — you'll talk to a real senior engineer.</p>
                        <!-- <p class="mb-0">Free 15-minute consultation. We'll review your site and provide actionable insights.</p> -->
                    </div>
                </div>

                <!-- Globe -->
                <div class="globe-hero-stage">
                    <div class="globe-particles-shell" data-globe-shell>
                        <div class="code-rain-wrap">
                            <canvas class="code-rain-canvas" data-code-rain></canvas>
                        </div>
                        <canvas class="globe-particles-canvas" data-globe-particles></canvas>
                    </div>
                    <!-- <div class="globe-hero-hint">Hover the globe — the surface scatters</div> -->
                </div>

            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="globe-particles/globe-particles.js"></script>
    <script>
        initGlobeParticles(document.querySelector('[data-globe-particles]'), {
            sphereCount: 4200,
            ringCount: 0,
            radius: 1.35,

            // Zoomed-in framing for a hero accent element rather than a full backdrop
            cameraDistance: 4.4,
            pointSize: 34,
            rotationSpeed: 0.1,
            mouseStrength: 0.045,

            // Bigger, slower-recovering scatter on hover
            repelStrength: 0.75,
            repelRadius: 0.85,
            repelEase: 0.04,

            // Land stays brand teal (accent); ocean moved off near-black navy
            // to white -> gray so dim/far-side points read as gray, not black.
            accentColor: '#3AA6A4',
            oceanColorShallow: '#f5f7fa',
            oceanColorMid: '#9aa5b1',
            oceanColorDeep: '#4b5563',
            landColorLow: '#acffff',
            landColorMid: '#3AA6A4',
            landColorHigh: '#297474',
        });
    </script>

    <!-- Code-rain backdrop: random lines from several languages, scrolling
         down behind the globe, only while the globe is hovered. -->
    <script>
        (function () {
            const CODE_LINES = [
                "function debounce(fn, wait) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), wait); }; }",
                "const sum = arr.reduce((a, b) => a + b, 0);",
                "async function handleRequest(req, res) { const data = await db.query(sql); res.json(data); }",
                "export default function App() { return <Globe spin />; }",
                "npm install --save-dev vitest @testing-library/react",
                "def average(numbers): return sum(numbers) / len(numbers)",
                "class Node:  def __init__(self, val): self.val = val",
                "for i in range(len(data)): total += data[i]",
                "import secrets; key = secrets.token_hex(16)",
                "@app.route('/api/health')  def health(): return {'status': 'ok'}",
                "func Fibonacci(n int) int { if n < 2 { return n }; return Fibonacci(n-1) + Fibonacci(n-2) }",
                "package main; import \"fmt\"; func main() { fmt.Println(\"ready\") }",
                "go func() { results <- worker(job) }()",
                "type Server struct { Addr string; Timeout time.Duration }",
                "fn fib(n: u64) -> u64 { if n < 2 { n } else { fib(n - 1) + fib(n - 2) } }",
                "let mut v: Vec<i32> = Vec::new();",
                "struct Point { x: f64, y: f64 }",
                "impl Shape for Circle { fn area(&self) -> f64 { PI * self.r * self.r } }",
                "SELECT id, name FROM users WHERE active = true ORDER BY created_at DESC;",
                "SELECT * FROM inventory WHERE stock < threshold;",
                "CREATE INDEX idx_orders_user_id ON orders(user_id);",
                "UPDATE sessions SET expires_at = NOW() + INTERVAL '1 hour';",
                "public class Order implements Comparable<Order> { private double total; }",
                "System.out.println(\"deploy complete\");",
                "#include <stdio.h>  int main() { printf(\"hello\\n\"); return 0; }",
                "SELECT COUNT(*) FROM sessions WHERE expires_at > now();",
                "git commit -m \"fix: race condition in worker pool\"",
                "kubectl rollout restart deployment/api",
                "docker build -t sigmasoft/api:latest .",
                "cargo build --release",
                "go test ./... -race -v",
                "curl -s https://api.sigmasoftai.com/v1/status",
                "let response = await fetch('/api/orders', { method: 'POST', body });",
                "assert response.status_code == 200, \"unexpected status\"",
                "with open('data.json') as f: config = json.load(f)",
                "module.exports = { plugins: [require('tailwindcss')] };",
                "interface Task { id: string; done: boolean; dueDate?: Date; }",
                "trait Repository<T> { fn find(&self, id: u64) -> Option<T>; }",
                "# 计算平均值(数据): return sum(数据) / len(数据列表)",
                "结构体 Point { x: f64, y: f64 }  // 二维坐标点",
                "函数 debounce(fn, wait) { ... } // 防抖动",
                "SELECT 名前, 年齢 FROM 用户 WHERE 状态 = '活动';",
                "// 生成随机密钥  import secrets",
                "echo \"deploy started at $(date)\" >> deploy.log",
            ];

            const canvas = document.querySelector('[data-code-rain]');
            const shell = document.querySelector('[data-globe-shell]');
            if (!canvas || !shell) return;

            const ctx = canvas.getContext('2d');
            let rows = [];
            let rafId = 0;
            let running = false;

            function pickLine() {
                return CODE_LINES[Math.floor(Math.random() * CODE_LINES.length)];
            }

            // A sparse handful of code lines scattered at random x/y, each
            // drifting slowly downward and re-randomizing once it drifts
            // past the bottom — the corner mask does the rest of the work
            // of keeping them clear of the globe itself.
            function buildRows(width, height) {
                const count = 11;
                const list = [];
                for (let i = 0; i < count; i++) {
                    list.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        speed: 6 + Math.random() * 10,
                        text: pickLine(),
                        bright: Math.random() < 0.12,
                    });
                }
                return list;
            }

            function resize() {
                const width = Math.max(1, canvas.clientWidth);
                const height = Math.max(1, canvas.clientHeight);
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                const fontSize = Math.max(6, Math.min(7.5, width / 85));
                canvas.dataset.fontSize = fontSize;
                rows = buildRows(width, height);
            }

            function draw() {
                const width = canvas.clientWidth;
                const height = canvas.clientHeight;
                const fontSize = parseFloat(canvas.dataset.fontSize) || 7;

                ctx.clearRect(0, 0, width, height);
                ctx.font = `${fontSize}px "SF Mono", "Fira Code", Menlo, Consolas, monospace`;
                ctx.textBaseline = 'top';

                for (const row of rows) {
                    ctx.fillStyle = row.bright
                        ? 'rgba(172, 255, 255, 0.55)'
                        : 'rgba(255, 255, 255, 0.14)';
                    ctx.fillText(row.text, row.x, row.y);

                    row.y += row.speed / 60;
                    if (row.y > height + fontSize * 2) {
                        row.y = -fontSize * 2;
                        row.x = Math.random() * width;
                        row.text = pickLine();
                        row.bright = Math.random() < 0.12;
                    }
                }

                if (running) rafId = requestAnimationFrame(draw);
            }

            function start() {
                if (running) return;
                running = true;
                resize();
                shell.classList.add('is-hovering');
                rafId = requestAnimationFrame(draw);
            }

            function stop() {
                running = false;
                shell.classList.remove('is-hovering');
                cancelAnimationFrame(rafId);
            }

            shell.addEventListener('mouseenter', start);
            shell.addEventListener('mouseleave', stop);
            shell.addEventListener('touchstart', start, { passive: true });
            shell.addEventListener('touchend', stop);
            window.addEventListener('resize', () => { if (running) resize(); });
        })();
    </script>
</body>

</html>
